version: '3.8'

services:
  portal-emetra:
    build:
      context: ./portal-emetra
      dockerfile: ../Dockerfile
    container_name: portal-emetra-app
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      - apps-net

networks:
  apps-net:
    driver: bridge
    external: true
    name: apps-net