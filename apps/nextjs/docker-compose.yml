services:
  portal-emetra:
    build:
      # IMPORTANTE: El contexto debe apuntar al directorio raiz de la app Next.js
      # Si portal-emetra es un monorepo, ajusta la ruta al subdirectorio correcto
      # Ejemplo: ./portal-emetra/frontend o ./portal-emetra/app
      context: ./portal-emetra
      dockerfile: ../Dockerfile
    container_name: portal-emetra-app
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      - apps-net

networks:
  apps-net:
    driver: bridge
    external: true
    name: apps-net