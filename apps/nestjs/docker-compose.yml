services:
  api-portal:
    build:
      context: ../..
      dockerfile: docker/apps/nestjs/Dockerfile
    container_name: nestjs-api-portal
    restart: unless-stopped
    ports:
      - "3003:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    env_file:
      - ./api-portal/.env
    networks:
      - apps-net

networks:
  apps-net:
    external: true

