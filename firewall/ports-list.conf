# Lista de puertos a abrir en firewalld
# Formato: PROTOCOL:PORT|DESCRIPTION
# Ejemplo: tcp:8080|Jenkins
# Ejemplo: tcp:3000|NextJS Application

# Aplicaciones
tcp:3002|NextJS Application
tcp:3001|PHP Oracle App
tcp:3003|NestJS API

# Jenkins
tcp:8080|Jenkins Web UI
tcp:50000|Jenkins Agent

# Base de datos Oracle
tcp:1521|Oracle Database

# Monitoring
tcp:9090|Prometheus
tcp:3000|Grafana

# Nginx (si se usa)
tcp:80|HTTP
tcp:443|HTTPS

